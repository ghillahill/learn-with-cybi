id: attacchi-password
passingScore: 0.7
questions:
  - id: tecniche
    type: match
    prompt: Abbina ogni sotto-tecnica di ATT&CK alla sua descrizione.
    pairs:
      - left: Password Guessing
        right: Tante password provate su un account
        explain: Spesso partendo da un elenco di password comuni.
      - left: Password Cracking
        right: Ricavare le password da hash già rubati
        explain: Di solito sui computer dell'attaccante, fuori dalla rete della vittima.
      - left: Password Spraying
        right: Poche password comuni provate su molti account
        explain: Serve a evitare il blocco dopo troppi tentativi falliti.
      - left: Credential Stuffing
        right: Credenziali rubate a un servizio, riusate su un altro
        explain: Funziona solo perché molte persone riusano la stessa password.

  - id: sale
    type: single
    prompt: A cosa serve il "sale" aggiunto alle password prima dell'hash?
    options:
      - text: A rendere inutili le tabelle precalcolate, come le rainbow table
        correct: true
        explain: Esatto. Con un sale diverso per ogni utente, anche due password uguali danno hash diversi.
      - text: A rendere la password più facile da ricordare
        correct: false
        explain: No. L'utente non vede nemmeno il sale.
      - text: A cifrare la connessione con il sito
        correct: false
        explain: No, quello è il compito di TLS.

  - id: lunghezza
    type: single
    prompt: "Password casuali: quale resiste di più a un attacco a forza bruta?"
    options:
      - text: 16 lettere minuscole
        correct: true
        explain: "Giusto: 26 alla 16 fa circa 44.000 miliardi di miliardi di combinazioni, milioni di volte più di 94 alla 8."
      - text: 8 caratteri di ogni tipo
        correct: false
        explain: No. 94 alla 8 fa circa 6 milioni di miliardi, molto meno di 26 alla 16.
      - text: 6 cifre
        correct: false
        explain: No. Un milione di combinazioni sono pochissime per un computer.

  - id: limite
    type: truefalse
    prompt: Per il NIST un servizio deve bloccare un autenticatore dopo al massimo 100 tentativi falliti consecutivi.
    options:
      - text: Vero
        correct: true
        explain: Giusto, lo prevede NIST SP 800-63B-4.
      - text: Falso
        correct: false
        explain: No, il limite di 100 tentativi falliti c'è.

  - id: stuffing
    type: single
    prompt: Qual è la difesa più diretta contro il credential stuffing?
    options:
      - text: Usare una password diversa per ogni servizio
        correct: true
        explain: Esatto. Se non riusi le password, quelle rubate altrove non aprono i tuoi account.
      - text: Cambiare lo sfondo del desktop
        correct: false
        explain: No, non c'entra niente.
      - text: Usare la stessa password ovunque, ma lunga
        correct: false
        explain: No. Una password lunga rubata a un servizio funziona comunque sugli altri.
