id: password-passkey
passingScore: 0.7
questions:
  - id: regole-nist
    type: multiple
    prompt: Quali regole prevede NIST SP 800-63B-4 per chi gestisce un servizio? Seleziona tutte quelle giuste.
    options:
      - text: Almeno 15 caratteri se la password è l'unica prova d'identità
        correct: true
        explain: Giusto. Bastano 8 caratteri solo se la password fa parte di un'autenticazione a più fattori.
      - text: Confrontare le nuove password con un elenco di password comuni o rubate
        correct: true
        explain: Giusto, così nessuno sceglie una password che un attaccante proverebbe subito.
      - text: Permettere i password manager e l'incolla
        correct: true
        explain: Giusto. I password manager aiutano a scegliere password forti.
      - text: Obbligare a cambiare password ogni 90 giorni
        correct: false
        explain: No. Il NIST vieta i cambi periodici obbligatori; si cambia solo se c'è un segnale di furto.
      - text: Imporre almeno una maiuscola, un numero e un simbolo
        correct: false
        explain: No. Il NIST vieta queste regole di composizione, perché le persone rispondono in modo prevedibile.

  - id: composizione
    type: single
    prompt: Perché il NIST non vuole più le regole del tipo "una maiuscola, un numero, un simbolo"?
    options:
      - text: Perché le persone le seguono in modo prevedibile, per esempio passando da "password" a "Password1"
        correct: true
        explain: Esatto. E il beneficio di queste regole si è rivelato minore del previsto.
      - text: Perché i computer non sanno leggere i simboli
        correct: false
        explain: "No, i simboli sono permessi: è l'obbligo di usarli che è vietato."
      - text: Perché le password non servono più
        correct: false
        explain: No. Le password restano molto usate; cambiano le regole per sceglierle.

  - id: cisa
    type: single
    prompt: Quale di queste password segue meglio i consigli di CISA?
    options:
      - text: Una sequenza casuale di 18 caratteri salvata nel password manager, diversa per ogni sito
        correct: true
        explain: Giusto. Almeno 16 caratteri, casuale, unica, in un password manager.
      - text: Il nome del tuo cane seguito dall'anno di nascita, uguale per tutti i siti
        correct: false
        explain: No. È prevedibile, corta e riusata.
      - text: Una password di 8 caratteri con un simbolo, cambiata ogni mese
        correct: false
        explain: No. È troppo corta, e cambiarla spesso non la rende più forte.

  - id: passkey-phishing
    type: single
    prompt: Perché una passkey resiste al phishing?
    options:
      - text: Perché il segreto usato è legato al dominio del sito vero, quindi su un sito falso non funziona
        correct: true
        explain: Esatto. WebAuthn sceglie il segreto in base al nome di dominio del sito.
      - text: Perché è una password molto lunga
        correct: false
        explain: No. Una passkey non è una password e non si scrive a mano.
      - text: Perché si cambia ogni 30 secondi
        correct: false
        explain: No, questo vale per i codici TOTP, che non sono resistenti al phishing.

  - id: date
    type: order
    prompt: Metti in ordine cronologico.
    items:
      - text: WebAuthn diventa Raccomandazione del W3C
        explain: Il 4 marzo 2019.
      - text: Apple, Google e Microsoft annunciano il supporto comune
        explain: Il 5 maggio 2022.
      - text: Pubblicazione di NIST SP 800-63B-4
        explain: Nel 2025.
