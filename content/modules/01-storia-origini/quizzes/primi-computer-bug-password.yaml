id: primi-computer-bug-password
passingScore: 0.7
questions:
  - id: bug
    type: truefalse
    prompt: La parola «bug» per indicare un difetto tecnico nasce con la falena trovata nel 1947.
    options:
      - text: Vero
        correct: false
        explain: È un mito. Edison usava già la parola nel 1878; la nota del 1947 scherza sul fatto che quella volta il bug era un insetto vero.
      - text: Falso
        correct: true
        explain: "Giusto. Il termine esisteva da decenni: Edison lo usa in lettere del 1878."

  - id: chi-falena
    type: single
    prompt: Chi ha trovato la falena nel Mark II, secondo il registro?
    options:
      - text: Il registro non lo dice
        correct: true
        explain: Esatto. La storia è spesso associata a Grace Hopper, ma non fu lei a trovare la falena né a scrivere la nota.
      - text: Grace Hopper
        correct: false
        explain: È la versione più diffusa, ma non è corretta. Hopper raccontava spesso l'episodio, ma il registro non indica chi trovò la falena.
      - text: Thomas Edison
        correct: false
        explain: No. Edison ha usato la parola «bug» nel 1878; con la falena del 1947 non c'entra.

  - id: von-neumann
    type: single
    prompt: Perché le lezioni di von Neumann del 1949 sono importanti per la sicurezza informatica?
    options:
      - text: Descrivono macchine teoriche capaci di copiare se stesse, base teorica dei futuri virus
        correct: true
        explain: Giusto. Von Neumann non pensava ai virus, ma l'idea di un programma che si copia da solo nasce qui.
      - text: Inventano la prima password
        correct: false
        explain: No. Le password arrivano con il CTSS del MIT, negli anni '60.
      - text: Descrivono il primo attacco informatico
        correct: false
        explain: No. Sono lezioni teoriche sugli automi auto-replicanti.

  - id: scherr
    type: multiple
    prompt: Cosa ha reso possibile il furto di password di Allan Scherr?
    options:
      - text: Il file delle password era salvato in chiaro
        correct: true
        explain: Sì. Bastava leggerlo per conoscere tutte le password.
      - text: Si poteva far stampare il file delle password
        correct: true
        explain: Sì. Scherr fa stampare il file e lo usa.
      - text: Le password erano troppo corte
        correct: false
        explain: "Le fonti non parlano della lunghezza: il problema era che il file non era protetto."

  - id: ctss
    type: single
    prompt: Perché il CTSS aveva bisogno delle password?
    options:
      - text: Perché più persone usavano lo stesso computer, ognuna con i propri file
        correct: true
        explain: Esatto. Serviva un modo per riconoscere ogni utente e separare i suoi file da quelli degli altri.
      - text: Per proteggerlo da Internet
        correct: false
        explain: No. Internet non esisteva ancora; il problema era condividere un computer tra molti utenti.
      - text: Per obbligo di legge
        correct: false
        explain: No. Era una scelta tecnica per separare gli utenti.
