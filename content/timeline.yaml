# Timeline interattiva (LEARNWITHCYBI.md §8.2).
# Ogni evento cita almeno una fonte di `sources` per id. `date` è una data
# parziale: AAAA, AAAA-MM o AAAA-MM-GG. `approximate: true` mostra "circa".
# `note` segnala stime, date in conflitto e attribuzioni contestate (⚠ in §9).
# Come le lezioni, in produzione si vedono solo gli eventi `pubblicata`.

