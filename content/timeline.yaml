events:
  # --- Modulo 1: le origini ---
  - id: maskelyne
    date: "1903-06"
    category: attacchi
    title: Maskelyne disturba la dimostrazione di Marconi
    description: >-
      Alla Royal Institution di Londra, durante una dimostrazione del telegrafo
      senza fili, l'apparato riceve "Rats" ripetuto e una filastrocca contro
      Marconi. Il responsabile è il mago e inventore Nevil Maskelyne.
    note: Il giorno esatto non è documentato in modo concorde.
    lesson: { module: storia-origini, lesson: il-primo-hacker }
    sources: [newscientist-2011, rigb-maskelyne]
    status: fonti-verificate
    lastVerified: 2026-10-22

  - id: rejewski-enigma
    date: "1932-12"
    category: crittografia
    title: Rejewski ricostruisce l'Enigma militare
    description: >-
      Marian Rejewski, dell'ufficio cifra polacco, ricostruisce il cablaggio
      interno dell'Enigma militare con la matematica e con documenti
      dell'intelligence francese.
    lesson: { module: storia-origini, lesson: enigma }
    sources: [mactutor-rejewski]
    status: fonti-verificate
    lastVerified: 2026-10-22

  - id: pyry
    date: "1939-07"
    category: crittografia
    title: L'incontro di Pyry
    description: >-
      Vicino a Varsavia, Rejewski, Różycki e Zygalski consegnano a britannici e
      francesi il loro metodo e copie ricostruite di Enigma.
    note: Secondo GCHQ il 25 e 26 luglio; altre fonti indicano date tra il 24 e il 27.
    lesson: { module: storia-origini, lesson: enigma }
    sources: [gchq-pyry]
    status: fonti-verificate
    lastVerified: 2026-10-22

  - id: bombe-victory
    date: "1940-03"
    category: crittografia
    title: Entra in servizio la prima Bombe
    description: >-
      A Bletchley Park entra in servizio "Victory", la prima Bombe britannica,
      progettata da Alan Turing a partire dalla "bomba" polacca.
    lesson: { module: storia-origini, lesson: enigma }
    sources: [britannica-bombe]
    status: fonti-verificate
    lastVerified: 2026-10-22

  - id: colossus
    date: "1944-02"
    category: crittografia
    title: Colossus attacca il cifrario Lorenz
    description: >-
      Il Colossus Mark I di Tommy Flowers è operativo. È uno dei primi computer
      elettronici digitali programmabili e serve contro Lorenz, non contro Enigma.
    lesson: { module: storia-origini, lesson: enigma }
    sources: [ieee-colossus]
    status: fonti-verificate
    lastVerified: 2026-10-22

  - id: primo-bug
    date: "1947-09-09"
    category: cultura
    title: Il "primo vero caso di bug"
    description: >-
      Sull'Harvard Mark II gli operatori trovano una falena in un relè e la
      attaccano al registro con la nota "First actual case of bug being found".
      La parola "bug" esisteva già da prima.
    lesson: { module: storia-origini, lesson: primi-computer-bug-password }
    sources: [smithsonian-log-book]
    status: fonti-verificate
    lastVerified: 2026-10-22

  - id: scherr-password
    date: "1962"
    approximate: true
    category: attacchi
    title: Il primo furto di password documentato
    description: >-
      Al MIT il dottorando Allan Scherr fa stampare il file delle password di
      CTSS, salvato in chiaro, per avere più tempo macchina. Lo confessa solo
      decenni dopo.
    note: La data viene dal racconto dello stesso Scherr; le fonti non sono concordi.
    lesson: { module: storia-origini, lesson: primi-computer-bug-password }
    sources: [wired-password-2012]
    status: fonti-verificate
    lastVerified: 2026-10-22

  - id: arpanet-lo
    date: "1969-10-29"
    category: cultura
    title: Il primo messaggio su ARPANET
    description: >-
      Dall'UCLA Charley Kline, seguito da Leonard Kleinrock, prova un login sul
      computer dello SRI. Arrivano solo "L" e "O", poi il sistema va in crash.
    lesson: { module: storia-origini, lesson: arpanet-creeper-crittografia }
    sources: [kleinrock-first-words]
    status: fonti-verificate
    lastVerified: 2026-10-22

  - id: esquire-blue-box
    date: "1971-10"
    category: cultura
    title: '"Secrets of the Little Blue Box" su Esquire'
    description: >-
      L'articolo di Ron Rosenbaum fa conoscere il phone phreaking al grande
      pubblico e diffonde il termine "phreak".
    lesson: { module: storia-origini, lesson: phreaker }
    sources: [esquire-1971]
    status: fonti-verificate
    lastVerified: 2026-10-22

  - id: creeper
    date: "1971"
    category: malware
    title: Creeper si sposta su ARPANET
    description: >-
      Programma sperimentale di Bob Thomas alla BBN: si sposta tra computer
      collegati ad ARPANET e mostra "I'M THE CREEPER: CATCH ME IF YOU CAN".
      Non fa danni.
    lesson: { module: storia-origini, lesson: arpanet-creeper-crittografia }
    sources: [sans-creeper]
    status: fonti-verificate
    lastVerified: 2026-10-22

  - id: anderson-report
    date: "1972-10"
    category: difesa
    title: L'Anderson Report e il reference monitor
    description: >-
      James P. Anderson consegna all'aeronautica militare americana un rapporto
      che introduce il reference monitor: un meccanismo che controlla ogni
      accesso di un soggetto a un oggetto.
    lesson: { module: storia-origini, lesson: arpanet-creeper-crittografia }
    sources: [anderson-report]
    status: fonti-verificate
    lastVerified: 2026-10-22

  - id: diffie-hellman
    date: "1976-11"
    category: crittografia
    title: Nasce la crittografia a chiave pubblica
    description: >-
      Whitfield Diffie e Martin Hellman pubblicano "New Directions in
      Cryptography": si può concordare una chiave segreta su un canale che
      altri possono ascoltare.
    lesson: { module: storia-origini, lesson: arpanet-creeper-crittografia }
    sources: [diffie-hellman-1976]
    status: fonti-verificate
    lastVerified: 2026-10-22

  - id: des
    date: "1977-01-15"
    category: crittografia
    title: Il DES diventa standard federale USA
    description: >-
      Il National Bureau of Standards pubblica il Data Encryption Standard
      (FIPS PUB 46) come standard federale americano per la cifratura.
    lesson: { module: storia-origini, lesson: arpanet-creeper-crittografia }
    sources: [fips-46]
    status: fonti-verificate
    lastVerified: 2026-10-22

  - id: rsa
    date: "1978-02"
    category: crittografia
    title: Esce l'articolo su RSA
    description: >-
      Rivest, Shamir e Adleman descrivono RSA, inventato nel 1977: un sistema a
      chiave pubblica che permette anche di firmare i messaggi.
    lesson: { module: storia-origini, lesson: arpanet-creeper-crittografia }
    sources: [rsa-1978]
    status: fonti-verificate
    lastVerified: 2026-10-22

  - id: ccc
    date: "1981-09-12"
    category: cultura
    title: Nasce il Chaos Computer Club
    description: >-
      A Berlino, nella redazione del quotidiano taz, nasce il Chaos Computer
      Club. Tra i fondatori c'è Wau Holland.
    lesson: { module: storia-origini, lesson: anni-80-virus }
    sources: [berliner-zeitung-ccc]
    status: fonti-verificate
    lastVerified: 2026-10-22

  - id: elk-cloner
    date: "1982"
    category: malware
    title: Elk Cloner
    description: >-
      Rich Skrenta, a 15 anni, scrive un virus del settore di avvio per Apple II
      che si diffonde con i floppy disk. È tra i primi virus per microcomputer
      diffusi fuori dal laboratorio.
    lesson: { module: storia-origini, lesson: anni-80-virus }
    sources: [inquirer-elk-cloner]
    status: fonti-verificate
    lastVerified: 2026-10-22

  - id: cohen-virus
    date: "1983-11"
    category: malware
    title: Fred Cohen e il nome "virus"
    description: >-
      Fred Cohen dimostra un programma auto-replicante durante un seminario
      all'University of Southern California. Il suo relatore, Leonard Adleman,
      suggerisce il nome "virus".
    lesson: { module: storia-origini, lesson: anni-80-virus }
    sources: [eset-adleman]
    status: fonti-verificate
    lastVerified: 2026-10-22

  - id: nsdd-145
    date: "1984-09-17"
    category: leggi
    title: La direttiva NSDD-145
    description: >-
      È una delle prime politiche presidenziali USA sulla sicurezza informatica.
      Nasce dagli studi chiesti da Ronald Reagan dopo aver visto il film
      WarGames (1983).
    note: Il legame diretto tra il film e la direttiva viene da un aneddoto riportato da Fred Kaplan.
    lesson: { module: storia-origini, lesson: anni-80-virus }
    sources: [kaplan-dark-territory]
    status: fonti-verificate
    lastVerified: 2026-10-22

  - id: btx-hack
    date: "1984-11"
    category: attacchi
    title: Il CCC e il BTX hack
    description: >-
      Il Chaos Computer Club sfrutta una falla del sistema BTX per addebitare
      alla Hamburger Sparkasse circa 135.000 marchi, poi li restituisce: vuole
      dimostrare che il sistema non è sicuro.
    note: La cifra varia tra 134.000 e 137.000 marchi a seconda della fonte.
    lesson: { module: storia-origini, lesson: anni-80-virus }
    sources: [computerwoche-btx]
    status: fonti-verificate
    lastVerified: 2026-10-22

  - id: brain
    date: "1986-01-19"
    category: malware
    title: Brain, il primo virus per PC IBM
    description: >-
      Dei fratelli Basit e Amjad Farooq Alvi, di Lahore. Nasce come protezione
      anticopia e contiene i loro nomi e il loro indirizzo.
    lesson: { module: storia-origini, lesson: anni-80-virus }
    sources: [computinghistory-brain]
    status: fonti-verificate
    lastVerified: 2026-10-22

  - id: cfaa
    date: "1986"
    category: leggi
    title: Il Computer Fraud and Abuse Act
    description: >-
      Gli Stati Uniti approvano una legge contro gli accessi non autorizzati ai
      computer. Sarà usata per condannare Robert Morris.
    lesson: { module: storia-origini, lesson: anni-80-virus }
    sources: [us-v-morris]
    status: fonti-verificate
    lastVerified: 2026-10-22

  - id: stoll
