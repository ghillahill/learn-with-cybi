# Glossario globale (§5.3). Ogni voce ha almeno una fonte di livello A o B.
entries:
  - id: cybersecurity
    term: Cybersecurity
    definition: Prevenzione dei danni, protezione e ripristino di computer, sistemi e servizi di comunicazione elettronica e delle informazioni che contengono, per garantirne disponibilità, integrità, autenticazione, riservatezza e non ripudio.
    sources:
      - id: nist-cybersecurity
        level: A
        title: NIST CSRC Glossary, "cybersecurity"
        publisher: NIST
        url: https://csrc.nist.gov/glossary/term/cybersecurity
        note: Definizione tratta da CNSSI 4009-2015. Traduzione di LearnWithCybi.

  - id: hacker
    term: Hacker
    definition: Parola con due significati. In origine (MIT, anni '50) indica chi esplora i sistemi in modo creativo e ingegnoso. Nei glossari di sicurezza indica chi tenta di accedere, o accede, a un sistema senza autorizzazione.
    sources:
      - id: mit-hack
        level: B
        title: Happy 60th Birthday to the Word "Hack"
        publisher: MIT Alumni Association
        url: https://alum.mit.edu/node/588
      - id: niccs-glossary
        level: A
        title: NICCS, Cybersecurity Glossary, "hacker"
        publisher: CISA
        url: https://niccs.cisa.gov/resources/glossary

  - id: white-hat
    term: White hat
    definition: Hacker etico, esperto di sicurezza che cerca le vulnerabilità con autorizzazione, per esempio con i test di penetrazione, per aiutare a correggerle.
    sources:
      - id: acsc-white-hat
        level: A
        title: Glossary, "white hat"
        publisher: Australian Cyber Security Centre
        url: https://www.cyber.gov.au/glossary/white-hat
      - id: kaspersky-hats
        level: B
        title: Black hat, White hat, and Gray hat hackers – Definition and Explanation
        publisher: Kaspersky
        url: https://kaspersky.com/resource-center/definitions/hacker-hat-types

  - id: black-hat
    term: Black hat
    definition: Criminale che entra nei sistemi informatici senza autorizzazione e con intenzioni dannose.
    sources:
      - id: kaspersky-hats
        level: B
        title: Black hat, White hat, and Gray hat hackers – Definition and Explanation
        publisher: Kaspersky
        url: https://kaspersky.com/resource-center/definitions/hacker-hat-types

  - id: grey-hat
    term: Grey hat
    definition: Hacker le cui attività non sono chiaramente legali (come quelle di un white hat) né chiaramente illegali (come quelle di un black hat). Le buone intenzioni, però, non rendono autorizzato un accesso.
    sources:
      - id: cyberwire-grey-hat
        level: B
        title: Glossary, "grey hat"
        publisher: The CyberWire
        url: https://www.thecyberwire.com/glossary/grey-hat

  - id: ctf
    term: CTF (Capture The Flag)
    definition: Gara di sicurezza informatica in cui i partecipanti cercano delle "bandiere" (stringhe di testo) nascoste in sistemi resi vulnerabili apposta. È un modo legale di fare pratica.
    sources:
      - id: splunk-ctf
        level: B
        title: What's CTF? Capture The Flag Competitions for Cybersecurity
        publisher: Splunk
        url: https://www.splunk.com/en_us/blog/learn/capture-the-flag-ctf.html

  - id: bug-bounty
    term: Bug bounty
    definition: Programma in cui un'organizzazione invita ricercatori esterni a cercare vulnerabilità nei propri sistemi, entro regole precise, e premia chi le segnala.
    sources:
      - id: darkreading-hack-pentagon
        level: B
        title: "Hack The Pentagon: DoD Launches First-Ever Federal Bug Bounty Program"
        publisher: Dark Reading
        year: 2016
        url: https://www.darkreading.com/vulnerabilities---threats/hack-the-pentagon-dod-launches-first-ever-federal-bug-bounty-program/d/d-id/1324542

  - id: divulgazione-coordinata
    term: Divulgazione coordinata delle vulnerabilità
    definition: Processo in cui chi scopre una vulnerabilità la segnala al produttore, che prepara una correzione; poi la vulnerabilità viene resa pubblica in modo concordato. In inglese Coordinated Vulnerability Disclosure (CVD).
    sources:
      - id: cisa-cvd
        level: A
        title: Coordinated Vulnerability Disclosure Process
        publisher: CISA
        url: https://cisa.gov/coordinated-vulnerability-disclosure-process

  - id: vulnerabilita
    term: Vulnerabilità
    definition: Debolezza di un sistema, delle sue procedure di sicurezza, dei controlli interni o della sua implementazione, che una minaccia può sfruttare.
    sources:
      - id: nist-vulnerability
        level: A
        title: NIST CSRC Glossary, "vulnerability"
        publisher: NIST
        url: https://csrc.nist.gov/glossary/term/vulnerability

  - id: phishing
    term: Phishing
    definition: Attacco che usa email o siti web malevoli per ottenere informazioni personali, fingendosi un'organizzazione affidabile.
    sources:
      - id: cisa-phishing
        level: A
        title: Avoiding Social Engineering and Phishing Attacks
        publisher: CISA
        url: https://www.cisa.gov/news-events/news/avoiding-social-engineering-and-phishing-attacks

  - id: riservatezza
    term: Riservatezza
    definition: Garanzia che le informazioni siano accessibili solo a chi è autorizzato. Perderla significa una divulgazione non autorizzata.
    sources:
      - &fips199
        id: fips-199
        level: A
        title: FIPS 199, Standards for Security Categorization of Federal Information and Information Systems
        publisher: NIST
        year: 2004
        url: https://csrc.nist.gov/files/pubs/shared/itlb/itlbul2004-03.pdf

  - id: integrita
    term: Integrità
    definition: Garanzia che le informazioni non vengano modificate o distrutte senza autorizzazione.
    sources:
      - *fips199

  - id: disponibilita
    term: Disponibilità
    definition: Garanzia che le informazioni e i sistemi siano accessibili e utilizzabili quando servono. Perderla significa un'interruzione dell'accesso.
    sources:
      - *fips199

  - id: cifrario
    term: Cifrario
    definition: Sistema crittografico che sostituisce le unità del testo in chiaro con simboli o gruppi di simboli, oppure le riordina, oppure fa entrambe le cose.
    sources:
      - id: nist-cipher
        level: A
        title: NIST CSRC Glossary, "cipher"
        publisher: NIST
        url: https://csrc.nist.gov/glossary/term/cipher
        note: Definizione tratta da CNSSI 4009-2022.

  - id: crittografia-chiave-pubblica
    term: Crittografia a chiave pubblica
    definition: Sistema in cui ognuno ha due chiavi. Quella pubblica si può dare a tutti; quella privata resta segreta. Pubblicare la chiave pubblica non rivela quella privata, e la chiave privata permette anche di firmare i messaggi.
    sources:
      - id: rsa-1978
        level: A
        title: A Method for Obtaining Digital Signatures and Public-Key Cryptosystems
        author: Ronald Rivest, Adi Shamir, Leonard Adleman
        publisher: Communications of the ACM 21(2)
        year: 1978
        url: https://doi.org/10.1145/359340.359342

  - id: reference-monitor
    term: Reference monitor
    definition: Meccanismo che controlla ogni accesso di un soggetto (un utente, un programma) a un oggetto (un file, una risorsa), applicando le regole di autorizzazione. Concetto introdotto dall'Anderson Report del 1972.
    sources:
      - id: anderson-report
        level: A
        title: Computer Security Technology Planning Study, Vol. II (ESD-TR-73-51)
        author: James P. Anderson
        publisher: US Air Force, Electronic Systems Division
        year: 1972
        url: https://apps.dtic.mil/sti/pdfs/AD0758206.pdf

  - id: virus
    term: Virus
    definition: Programma malevolo che si propaga modificando altri programmi o file. Non funziona da solo, ma si attiva quando viene eseguito il programma che lo ospita.
    sources:
      - id: nist-virus
        level: A
        title: NIST CSRC Glossary, "virus"
        publisher: NIST
        url: https://csrc.nist.gov/glossary/term/virus

  - id: worm
    term: Worm
    definition: Programma autonomo che si copia da solo e si propaga attraverso le reti di computer, senza bisogno di un programma ospite né di un'azione dell'utente.
    sources:
      - id: nist-worm
        level: A
        title: NIST CSRC Glossary, "worm"
        publisher: NIST
        url: https://csrc.nist.gov/glossary/term/worm

  - id: buffer-overflow
    term: Buffer overflow
    definition: Errore per cui un programma accetta in un'area di memoria più dati di quanti ne possa contenere, sovrascrivendo altre informazioni. Gli attaccanti lo sfruttano per bloccare il sistema o per fargli eseguire codice preparato apposta.
    sources:
      - id: nist-buffer-overflow
        level: A
        title: NIST CSRC Glossary, "buffer overflow"
        publisher: NIST
        url: https://csrc.nist.gov/glossary/term/buffer_overflow

  - id: ransomware
    term: Ransomware
    definition: Malware progettato per cifrare i file di un dispositivo, rendendoli inutilizzabili, e chiedere un riscatto in cambio della decifratura.
    sources:
      - id: cisa-ransomware
        level: A
        title: Ransomware General Security Postcard
        publisher: CISA
        url: https://www.cisa.gov/sites/default/files/publications/Ransomware%20General%20Security%20Postcard%206.23.2021_508c.pdf

  - id: exploit
    term: Exploit
    definition: Tecnica per violare la sicurezza di una rete o di un sistema informatico, contro le regole di sicurezza. Di solito sfrutta una vulnerabilità.
    sources:
      - &niccs
        id: cisa-niccs-glossary
        level: A
        title: NICCS Cybersecurity Glossary
        publisher: CISA
        url: https://niccs.cisa.gov/resources/glossary

  - id: patch
    term: Patch
    definition: Correzione di un programma ("fix") distribuita agli utenti per risolvere un problema individuato, come un difetto di sicurezza. È la soluzione immediata, non sempre quella definitiva.
    sources:
      - id: nist-patch
        level: A
        title: NIST CSRC Glossary, "patch"
        publisher: NIST
        url: https://csrc.nist.gov/glossary/term/patch
        note: Definizione tratta da NIST SP 800-45 Version 2.

  - id: zero-day
    term: Zero-day
    definition: Attacco che sfrutta una vulnerabilità dell'hardware, del firmware o del software non ancora nota. Chi difende ha avuto "zero giorni" per correggerla.
    sources:
      - id: nist-zero-day
        level: A
        title: NIST CSRC Glossary, "zero day attack"
        publisher: NIST
        url: https://csrc.nist.gov/glossary/term/zero_day_attack
        note: Definizione tratta da CNSSI 4009-2022. La spiegazione del nome è una parafrasi didattica.

  - id: botnet
    term: Botnet
    definition: Rete di dispositivi collegati a Internet (computer, smartphone, oggetti IoT) presi sotto controllo da un criminale, che li comanda a distanza. Si usa per attacchi DDoS, spam e furto di dati.
    sources:
      - *niccs
      - id: nist-botnet
        level: A
        title: NIST CSRC Glossary, "botnet"
        publisher: NIST
        url: https://csrc.nist.gov/glossary/term/botnet

  - id: ddos
    term: DDoS (Distributed Denial of Service)
    definition: Attacco che rende un servizio irraggiungibile (denial of service) usando contemporaneamente moltissimi computer o dispositivi.
    sources:
      - id: nist-ddos
        level: A
        title: NIST CSRC Glossary, "distributed denial of service"
        publisher: NIST
        url: https://csrc.nist.gov/glossary/term/distributed_denial_of_service

  - id: apt
    term: APT (Advanced Persistent Threat)
    definition: Avversario con grandi competenze e risorse, che usa più strade d'attacco per entrare nei sistemi di un'organizzazione e restarci a lungo, per rubare informazioni o danneggiarne le attività. Insiste nel tempo e si adatta alle difese.
    sources:
      - id: nist-apt
        level: A
        title: NIST CSRC Glossary, "advanced persistent threat"
        publisher: NIST
        url: https://csrc.nist.gov/glossary/term/advanced_persistent_threat
        note: Definizione tratta da NIST SP 800-39.

  - id: backdoor
    term: Backdoor
    definition: Modo non documentato di accedere a un sistema informatico, una "porta sul retro" che aggira i controlli normali. È un rischio per la sicurezza.
    sources:
      - id: nist-backdoor
        level: A
        title: NIST CSRC Glossary, "backdoor"
        publisher: NIST
        url: https://csrc.nist.gov/glossary/term/backdoor
        note: Definizione tratta da NIST SP 800-82r3.

  - id: attacco-supply-chain
    term: Attacco alla supply chain
    definition: Attacco in cui l'avversario sfrutta le vulnerabilità della catena di fornitura (supply chain) dell'obiettivo, cioè dei prodotti o servizi da cui dipende, per esempio un software e i suoi aggiornamenti.
    sources:
      - id: nist-supply-chain-attack
        level: A
        title: NIST CSRC Glossary, "supply chain attack"
        publisher: NIST
        url: https://csrc.nist.gov/glossary/term/supply_chain_attack
        note: Definizione tratta da CNSSI 4009-2022.

  - id: minimo-privilegio
    term: Minimo privilegio (least privilege)
    definition: Principio di sicurezza per cui un sistema limita i privilegi di accesso degli utenti, e dei processi che agiscono per loro, a quelli necessari per svolgere i compiti assegnati.
    sources:
      - id: nist-least-privilege
        level: A
        title: NIST CSRC Glossary, "least privilege"
        publisher: NIST
        url: https://csrc.nist.gov/glossary/term/least_privilege
        note: Definizione tratta da CNSSI 4009-2022. Traduzione di LearnWithCybi.
      - id: saltzer-schroeder
        level: A
        title: The Protection of Information in Computer Systems (Saltzer e Schroeder, 1975)
        url: https://www.cs.virginia.edu/~evans/cs551/saltzer/

  - id: tls
    term: TLS (Transport Layer Security)
    definition: Protocollo di sicurezza che garantisce riservatezza e integrità dei dati tra due applicazioni che comunicano, per esempio tra browser e server web. Il traffico HTTP protetto con TLS si chiama HTTPS.
    sources:
      - id: nist-tls
        level: A
        title: NIST CSRC Glossary, "transport layer security"
        publisher: NIST
        url: https://csrc.nist.gov/glossary/term/transport_layer_security
        note: Definizioni tratte da CNSSI 4009-2022 e NISTIR 7711. Traduzione di LearnWithCybi.
